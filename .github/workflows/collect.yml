# Free always-on mode: every 15 minutes, collect feeds and publish the site
# to GitHub Pages. No server, no card. Repo must be public for free Pages.
name: Collect feeds

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may run it a few minutes late at busy times
  workflow_dispatch:          # "Run workflow" button for a manual run
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download last run's events
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/events.json" -o public/events.json || echo "No previous events (first run)"

      - name: Collect feeds
        run: node src/collect.js public/events.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
