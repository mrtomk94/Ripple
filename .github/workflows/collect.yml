# Free always-on mode: every 15 minutes, collect feeds and publish the site
# to GitHub Pages. No server, no card. Repo must be public for free Pages.
name: Collect feeds

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may run it a few minutes late at busy times
  workflow_dispatch:          # "Run workflow" button for a manual run
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Download last run's events
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/events.json" -o public/events.json || echo "No previous events (first run)"

      - name: Collect feeds
        run: node src/collect.js public/events.json
        env:
          # Optional private secret (Settings > Secrets and variables > Actions).
          # Turns on SEC filings; never stored in the repo.
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
